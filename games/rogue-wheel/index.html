    <style>
      /* Inline safety net to guarantee truly fullscreen with no footer */
      html, body {
        margin: 0 !important;
        padding: 0 !important;
        width: 100% !important;
        height: 100% !important;
        overflow: hidden !important;
        background: #231F20 !important;
      }
      #unity-container {
        position: fixed !important;
        top: 0 !important;
        left: 0 !important;
        width: 100% !important;
        height: 100% !important;
        border: none !important;
        outline: none !important;
        overflow: hidden !important;
      }
      #unity-canvas {
        display: block !important;
        width: 100% !important;
        height: 100% !important;
        background: #231F20 !important;
        border: none !important;
        outline: none !important;
      }
      /* Kill any Unity footer / branding bar that the template injects */
      #unity-footer,
      .unity-footer,
      [class*="unity-footer"],
      [id*="unity-footer"] {
        display: none !important;
        height: 0 !important;
        visibility: hidden !important;
        overflow: hidden !important;
      }
      /* Accessible content + discreet back link */
      .sr-only {
        position: absolute;
        width: 1px; height: 1px;
        margin: -1px; padding: 0;
        overflow: hidden;
        clip: rect(0 0 0 0);
        white-space: nowrap;
        border: 0;
      }
      .webgl-back {
        position: fixed;
        top: 12px; left: 12px;
        z-index: 100;
        font-family: Inter, system-ui, sans-serif;
        font-size: 13px; font-weight: 600;
        color: #fff;
        background: rgba(20, 20, 22, 0.7);
        border: 1px solid rgba(199, 200, 170, 0.3);
        border-radius: 999px;
        padding: 8px 14px;
        text-decoration: none;
        backdrop-filter: blur(6px);
        opacity: 0.35;
        transition: opacity 0.25s ease;
      }
      .webgl-back:hover { opacity: 1; }
    </style>

  <body>
    <header class="sr-only">
      <h1>Rogue Wheel: Catapult Brawl — Play in Browser</h1>
      <p>Free physics-based rogue-lite catapult game by Mimi Games. Play directly in your browser, no download required, and no energy system.</p>
      <nav><a href="../../rogue-wheel.html">Rogue Wheel details and Google Play download</a></nav>
    </header>
    <a class="webgl-back" href="../../rogue-wheel.html" aria-label="Back to Rogue Wheel page">&larr; Rogue Wheel</a>
    <noscript>
      <div style="position:fixed;top:0;left:0;right:0;bottom:0;z-index:999;background:#231F20;color:#fff;font-family:Inter,system-ui,sans-serif;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px;">
        <div>
          <p style="font-size:18px;font-weight:600;margin:0 0 8px;">JavaScript is required to play Rogue Wheel in your browser.</p>
          <p style="margin:0 0 16px;color:rgba(255,255,255,0.7);">You can still get the free game on <a href="https://play.google.com/store/apps/details?id=com.mimigames.catapultbrawl" style="color:#fff;">Google Play</a> or <a href="../../rogue-wheel.html" style="color:#fff;">learn more about Rogue Wheel</a>.</p>
        </div>
      </div>
    </noscript>
    <div id="unity-container">
      <canvas id="unity-canvas" tabindex="-1"></canvas>
      <div id="unity-loading-bar">
        <div id="unity-logo"></div>
        <div id="unity-progress-bar-empty">
          <div id="unity-progress-bar-full"></div>
        </div>
      </div>
      <div id="unity-warning"> </div>
    </div>
    <script>
      // Register service worker for PWA
      window.addEventListener("load", function () {
        if ("serviceWorker" in navigator) {
          navigator.serviceWorker.register("ServiceWorker.js");
        }
      });

      var container = document.querySelector("#unity-container");
      var canvas    = document.querySelector("#unity-canvas");
      var loadingBar     = document.querySelector("#unity-loading-bar");
      var progressBarFull = document.querySelector("#unity-progress-bar-full");
      var warningBanner  = document.querySelector("#unity-warning");

      // Keep canvas exactly matching the window — no frame, no footer
      function resizeCanvas() {
        canvas.style.width  = window.innerWidth  + "px";
        canvas.style.height = window.innerHeight + "px";
      }
      resizeCanvas();
      window.addEventListener("resize", resizeCanvas);

      // Hide any dynamically injected Unity footer elements
      function hideUnityFooter() {
        var footer = document.getElementById("unity-footer");
        if (footer) {
          footer.style.cssText = "display:none!important;height:0!important;overflow:hidden!important;";
        }
      }
      // Poll for a short window in case the loader injects a footer after load
      var footerCheckCount = 0;
      var footerCheckInterval = setInterval(function () {
        hideUnityFooter();
        footerCheckCount++;
        if (footerCheckCount > 20) clearInterval(footerCheckInterval);
      }, 300);

      function unityShowBanner(msg, type) {
        function updateBannerVisibility() {
          warningBanner.style.display = warningBanner.children.length ? 'block' : 'none';
        }
        var div = document.createElement('div');
        div.innerHTML = msg;
        warningBanner.appendChild(div);
        if (type == 'error') div.style = 'background: red; padding: 10px;';
        else {
          if (type == 'warning') div.style = 'background: yellow; padding: 10px;';
          setTimeout(function() {
            warningBanner.removeChild(div);
            updateBannerVisibility();
          }, 5000);
        }
        updateBannerVisibility();
      }

      var buildUrl  = "Build";
      var loaderUrl = buildUrl + "/RogueWheel.loader.js";
      var config = {
        arguments: [],
        dataUrl:       buildUrl + "/RogueWheel.data",
        frameworkUrl:  buildUrl + "/RogueWheel.framework.js",
        codeUrl:       buildUrl + "/RogueWheel.wasm",
        streamingAssetsUrl: "StreamingAssets",
        companyName:   "Mimi Games",
        productName:   "Rogue Wheel",
        productVersion: "1.4.3",
        showBanner: unityShowBanner,
      };

      loadingBar.style.display = "block";

      var script = document.createElement("script");
      script.src = loaderUrl;
      script.onload = () => {
        createUnityInstance(canvas, config, (progress) => {
          progressBarFull.style.width = 100 * progress + "%";
        }).then((unityInstance) => {
          loadingBar.style.display = "none";
          clearInterval(footerCheckInterval);
          hideUnityFooter();
        }).catch((message) => {
          alert(message);
        });
      };
      document.body.appendChild(script);
    </script>
  </body>
</html>
