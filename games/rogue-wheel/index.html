<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes">
    <title>Rogue Wheel WebGL | Mimi Games</title>
    <link rel="shortcut icon" href="TemplateData/favicon.ico">
    <link rel="stylesheet" href="TemplateData/style.css">
    <link rel="manifest" href="manifest.webmanifest">
    <style>
      /* Inline safety net to guarantee truly fullscreen with no footer */
      html, body {
        margin: 0 !important;
        padding: 0 !important;
        width: 100% !important;
        height: 100% !important;
        overflow: hidden !important;
        background: #231F20 !important;
      }
      #unity-container {
        position: fixed !important;
        top: 0 !important;
        left: 0 !important;
        width: 100% !important;
        height: 100% !important;
        border: none !important;
        outline: none !important;
        overflow: hidden !important;
      }
      #unity-canvas {
        display: block !important;
        width: 100% !important;
        height: 100% !important;
        background: #231F20 !important;
        border: none !important;
        outline: none !important;
      }
      /* Kill any Unity footer / branding bar that the template injects */
      #unity-footer,
      .unity-footer,
      [class*="unity-footer"],
      [id*="unity-footer"] {
        display: none !important;
        height: 0 !important;
        visibility: hidden !important;
        overflow: hidden !important;
      }
    </style>
  </head>
  <body>
    <div id="unity-container">
      <canvas id="unity-canvas" tabindex="-1"></canvas>
      <div id="unity-loading-bar">
        <div id="unity-logo"></div>
        <div id="unity-progress-bar-empty">
          <div id="unity-progress-bar-full"></div>
        </div>
      </div>
      <div id="unity-warning"> </div>
    </div>
    <script>
      // Register service worker for PWA
      window.addEventListener("load", function () {
        if ("serviceWorker" in navigator) {
          navigator.serviceWorker.register("ServiceWorker.js");
        }
      });

      var container = document.querySelector("#unity-container");
      var canvas    = document.querySelector("#unity-canvas");
      var loadingBar     = document.querySelector("#unity-loading-bar");
      var progressBarFull = document.querySelector("#unity-progress-bar-full");
      var warningBanner  = document.querySelector("#unity-warning");

      // Keep canvas exactly matching the window — no frame, no footer
      function resizeCanvas() {
        canvas.style.width  = window.innerWidth  + "px";
        canvas.style.height = window.innerHeight + "px";
      }
      resizeCanvas();
      window.addEventListener("resize", resizeCanvas);

      // Hide any dynamically injected Unity footer elements
      function hideUnityFooter() {
        var footer = document.getElementById("unity-footer");
        if (footer) {
          footer.style.cssText = "display:none!important;height:0!important;overflow:hidden!important;";
        }
      }
      // Poll for a short window in case the loader injects a footer after load
      var footerCheckCount = 0;
      var footerCheckInterval = setInterval(function () {
        hideUnityFooter();
        footerCheckCount++;
        if (footerCheckCount > 20) clearInterval(footerCheckInterval);
      }, 300);

      function unityShowBanner(msg, type) {
        function updateBannerVisibility() {
          warningBanner.style.display = warningBanner.children.length ? 'block' : 'none';
        }
        var div = document.createElement('div');
        div.innerHTML = msg;
        warningBanner.appendChild(div);
        if (type == 'error') div.style = 'background: red; padding: 10px;';
        else {
          if (type == 'warning') div.style = 'background: yellow; padding: 10px;';
          setTimeout(function() {
            warningBanner.removeChild(div);
            updateBannerVisibility();
          }, 5000);
        }
        updateBannerVisibility();
      }

      var buildUrl  = "Build";
      var loaderUrl = buildUrl + "/RogueWheel.loader.js";
      var config = {
        arguments: [],
        dataUrl:       buildUrl + "/RogueWheel.data",
        frameworkUrl:  buildUrl + "/RogueWheel.framework.js",
        codeUrl:       buildUrl + "/RogueWheel.wasm",
        streamingAssetsUrl: "StreamingAssets",
        companyName:   "Mimi Games",
        productName:   "Rogue Wheel",
        productVersion: "1.4.3",
        showBanner: unityShowBanner,
      };

      loadingBar.style.display = "block";

      var script = document.createElement("script");
      script.src = loaderUrl;
      script.onload = () => {
        createUnityInstance(canvas, config, (progress) => {
          progressBarFull.style.width = 100 * progress + "%";
        }).then((unityInstance) => {
          loadingBar.style.display = "none";
          clearInterval(footerCheckInterval);
          hideUnityFooter();
        }).catch((message) => {
          alert(message);
        });
      };
      document.body.appendChild(script);
    </script>
  </body>
</html>
